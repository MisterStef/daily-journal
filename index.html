<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Journal</title>
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<meta name="description" content="Private daily journal: mood, energy, sleep, stress, wins and reflections">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-400.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(fonts/inter-500.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:600 700;font-display:swap;src:url(fonts/inter-600.woff) format("woff")}
@font-face{font-family:"Inter Display";font-weight:600;font-display:swap;src:url(fonts/interdisplay-600.woff) format("woff")}
@font-face{font-family:"Inter Display";font-weight:700;font-display:swap;src:url(fonts/interdisplay-700.woff) format("woff")}
:root{
  color-scheme:dark;
  --bg:#050506; --card:#0f0f11; --tile:#18181b; --field:#0a0a0c; --ink:#f4f0e6; --mute:#8d8981; --line:#1f1f23; --line-2:#2b2b31;
  --accent:#e2c48f; --accent-ink:#161108; --accent-soft:rgba(226,196,143,.10); --accent-line:rgba(226,196,143,.26);
  --warn:#ff9076; --warn-soft:#2a1611; --bar:#7f6d4b; --rec:#e5564b;
  --energy:#e2c48f; --mint:#9ed9c3; --ember:#f08a6c;
  --hero:#0b0b0d; --hero-2:#2b2419; --hero-ink:#f4f0e6; --hero-mute:#a39c8e;
  --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 30px 50px -36px #000;
  --display:"Inter Display","Inter",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--bg)}
body{background:radial-gradient(760px 380px at 50% -140px,rgba(226,196,143,.13),transparent 70%) no-repeat,var(--bg);color:var(--ink);font:400 15.5px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:18px 16px 128px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 2px 20px}
h1{font:700 30px/1.08 var(--display);margin:0;letter-spacing:-.03em}
h2{font:600 18px/1.25 var(--display);margin:0 0 14px;letter-spacing:-.012em}
h3{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:600}
.sync{font-size:12.5px;color:var(--mute);margin-top:6px}
.ic{display:block;flex:0 0 auto}
.ibtn{width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:0;transition:transform .15s var(--ease),border-color .2s}
.ibtn:active{transform:scale(.92);border-color:var(--accent-line)}

/* floating navigation */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),520px);z-index:6;display:flex;gap:2px;padding:6px;border-radius:26px;background:rgba(20,20,23,.8);-webkit-backdrop-filter:saturate(1.4) blur(20px);backdrop-filter:saturate(1.4) blur(20px);border:1px solid var(--line-2);box-shadow:0 20px 40px -16px #000}
nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--mute);padding:4px 0 3px;font:500 11px/1.2 "Inter",system-ui,sans-serif;cursor:pointer;transition:color .25s}
nav .nic{display:grid;place-items:center;width:50px;height:30px;border-radius:999px;transition:background .3s var(--ease),transform .3s var(--ease)}
nav button[aria-selected="true"]{color:var(--accent);font-weight:600}
nav button[aria-selected="true"] .nic{background:var(--accent-soft);transform:scale(1.04)}
nav button:active .nic{transform:scale(.9)}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
label{display:block;font-size:13.5px;color:var(--mute);margin:0 0 7px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:#5d5a55}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
#f-journal{font-family:var(--serif);font-size:17px;line-height:1.7;padding:16px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,196,143,.16)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:11px 18px;font-weight:600;display:inline-block;text-align:center;transition:transform .15s var(--ease),filter .2s,background .2s}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2);font-weight:500}
.btn.rec{background:var(--rec);color:#fff}
.btn.small{padding:8px 13px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.scale button{height:50px;border:1px solid var(--line-2);background:var(--tile);color:var(--ink);border-radius:15px;font:600 17px var(--display);font-variant-numeric:tabular-nums;transition:background .25s,color .25s,border-color .25s,transform .15s var(--ease)}
.scale button:active{transform:scale(.93)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale button.pop{animation:pop .38s var(--ease)}
@keyframes pop{0%{transform:scale(.88)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line-2);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;transition:background .2s,color .2s,border-color .2s,transform .15s var(--ease)}
button.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#0a0a0c;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink);font-weight:600}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 14px}
.datebar .lbl{text-align:center;flex:1;font:600 17px/1.2 var(--display);letter-spacing:-.01em}
.datebar .lbl span{display:block;font:400 12.5px/1.3 "Inter",system-ui,sans-serif;color:var(--mute);letter-spacing:0;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.stat{background:var(--tile);border-radius:16px;padding:13px 14px}
.stat b{display:block;font:700 24px/1.15 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute);line-height:1.3;display:block;margin-top:3px}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.banner{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:18px;padding:13px 15px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14.5px}
.banner.col{display:block}
.banner .btn{white-space:nowrap;flex:0 0 auto}
.warn{background:var(--warn-soft);border-radius:14px;padding:11px 13px;font-size:14px;margin-top:10px}
.pill{display:inline-block;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.entry{border-top:1px solid var(--line);padding:14px 0}
.entry:first-child{border-top:0}
.entry .d{font:600 16px var(--display)}
.entry .meta{font-size:13px;color:var(--mute);margin:2px 0 6px}
.entry p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry p.refl{font-family:var(--serif);font-size:16px;line-height:1.65}
.entry .k{font:600 12px "Inter",system-ui,sans-serif;color:var(--accent)}
.ai{white-space:pre-wrap;line-height:1.65;margin-top:12px;font-family:var(--serif);font-size:16px}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.hl{grid-template-columns:1fr}}
.hl>div{background:var(--tile);border-radius:16px;padding:12px 13px}
.hl p{margin:4px 0;overflow-wrap:anywhere}
.bars .b{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0}
.bars .b i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--bar),var(--accent))}
.bars .b em{font-style:normal;color:var(--mute);width:96px;flex:0 0 auto}
svg text{fill:var(--mute);font-size:11px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px;margin-top:10px;color:var(--ink)}
.partial{font-size:14px;color:var(--mute);font-style:italic;margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:7px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* the day dial: mood, energy and stress in one glance */
.card.hero{padding:0;overflow:hidden;border-color:var(--line-2)}
.hero-face{display:flex;align-items:center;gap:20px;padding:26px 20px;color:var(--hero-ink);background:radial-gradient(130% 110% at 0% 0%,var(--hero-2),var(--hero) 62%)}
.dial{position:relative;width:156px;height:156px;flex:0 0 auto}
.dial svg{display:block;width:100%;height:100%}
.dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial-c b{font:700 32px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dial-c span{font-size:11.5px;color:var(--hero-mute);margin-top:4px}
.legend{flex:1;min-width:0;display:grid;gap:13px}
.lg{display:grid;grid-template-columns:10px 1fr;column-gap:10px;align-items:center}
.lg i{width:10px;height:10px;border-radius:50%}
.lg span{font-size:12px;color:var(--hero-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{grid-column:2;font:600 20px/1.15 var(--display);letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.lg b small{font:400 12.5px "Inter",system-ui,sans-serif;color:var(--hero-mute);letter-spacing:0}
.hero-more{padding:13px 18px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
@media (max-width:350px){.dial{width:128px;height:128px}.dial-c b{font-size:26px}}
[data-to]{transition:stroke-dashoffset .9s var(--ease)}

.wrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow span:last-child{font-variant-numeric:tabular-nums;color:var(--mute);text-align:right}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}

/* motion: one short entrance when you change tabs; everything else answers a tap */
#view.enter{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><div><h1 id="greet">Daily Journal</h1><div id="sync" class="sync">Loading…</div></div><button class="ibtn" data-tab="settings" aria-label="Settings"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></button></header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => dstr(new Date());
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return dstr(d); };
const addMonths = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const weekStart = s => { const d=parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return dstr(d); }; /* Monday */
const fmtLong = s => parse(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const fmtShort = s => parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtMonth = ym => parse(ym+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'});
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const r1 = n => n==null ? '–' : (Math.round(n*10)/10).toString();
const calm = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const MOOD_WORDS = ['Happy','Calm','Content','Grateful','Hopeful','Motivated','Tired','Anxious','Frustrated','Sad','Angry','Overwhelmed'];
const MOOD_LABEL = ['Rough','Low','Okay','Good','Great'];
const ITEM_KEYS = ['mood','energy','sleep','stress','win','journal','priority'];

/* After midnight (before 4am) most people are still writing about the day that just ended. */
const defaultDate = () => { const n=new Date(); return n.getHours()<4 ? addDays(todayStr(),-1) : todayStr(); };

/* ---------- state ---------- */
const S = { days:{}, reviews:{}, date:defaultDate(), wk:weekStart(defaultDate()), mo:defaultDate().slice(0,7), tab:'today', range:30, search:'',
  listening:false, partial:'', dictNote:'', ai:{busy:false,key:null,text:''}, installEvt:null };
const SET = { apiKey:'', model:'claude-sonnet-5-5' };

/* ---------- persistence: on this device (localStorage) ---------- */
const LS='daily-journal-v1', LSS='dj-settings';
function setSync(t){ const e=$('#sync'); if(e) e.textContent=t; }
try{ Object.assign(SET,JSON.parse(localStorage.getItem(LSS)||'{}')); }catch(e){}
function saveSet(){ try{ localStorage.setItem(LSS,JSON.stringify(SET)); }catch(e){} }
function loadLocal(){
  try{ const o=JSON.parse(localStorage.getItem(LS)||'null'); if(o){ S.days=o.days||{}; S.reviews=o.reviews||{}; } }catch(e){}
}
let saveTimer=0;
function saveNow(){
  clearTimeout(saveTimer); saveTimer=0;
  try{ localStorage.setItem(LS, JSON.stringify({days:S.days,reviews:S.reviews})); setSync('Saved on this device'); }
  catch(e){ setSync('Could not save (storage full or blocked)'); }
}
function queueSave(){ setSync('Saving…'); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,400); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && saveTimer) saveNow(); });
window.addEventListener('pagehide',()=>{ if(saveTimer) saveNow(); });

/* ---------- data access ---------- */
const day = date => S.days[date] || {date};
function editDay(date,fn){ const d=S.days[date]||(S.days[date]={date}); fn(d); queueSave(); }
function editReview(key,fn){ const r=S.reviews[key]||(S.reviews[key]={key}); fn(r); queueSave(); }
const filled = (d,k) => { const v=d[k]; return v!=null && String(v).trim()!==''; };
const hasContent = d => !!d && ITEM_KEYS.some(k=>filled(d,k));
const progress = d => ITEM_KEYS.filter(k=>filled(d,k)).length;
function streak(){
  let k=todayStr(); if(!hasContent(S.days[k])) k=addDays(k,-1);
  let n=0; while(hasContent(S.days[k])){ n++; k=addDays(k,-1); } return n;
}

/* ---------- icons ---------- */
const IC={
  today:'<path d="M6 4.5h10a3 3 0 0 1 3 3v12H9a3 3 0 0 1-3-3z"/><path d="M10 9h6M10 13h4"/>',
  weekly:'<rect x="4" y="5.5" width="16" height="14" rx="3.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4M8 14.5h8"/>',
  monthly:'<rect x="4" y="5.5" width="16" height="14" rx="3.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4M8.5 13.5h.01M12 13.5h.01M15.5 13.5h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/>',
  history:'<path d="M4.5 6.5h15M4.5 12h15M4.5 17.5h9"/>',
  trends:'<path d="M4 19.5h16"/><path d="M5 15l4.5-4.5 3.5 3L19 7"/><path d="M15 7h4v4"/>',
  mic:'<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>'
};
const ic=(n,s=22)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const PREV={};
function arc(c,r,w,color,pct,key){
  pct=Math.max(0,Math.min(100,pct));
  return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-opacity=".17" stroke-width="${w}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" ${pct<=0?'stroke-opacity="0"':''} data-key="${key}" data-to="${(100-pct).toFixed(2)}" style="stroke-dashoffset:${PREV[key]??100}" transform="rotate(-90 ${c} ${c})"/>`;
}
function animateArcs(){
  const arcs=[...document.querySelectorAll('[data-to]')]; if(!arcs.length) return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>arcs.forEach(a=>{ a.style.strokeDashoffset=a.dataset.to; PREV[a.dataset.key]=a.dataset.to; })));
}

/* ---------- charts (inline SVG) ---------- */
function chart(vals,labels,opt={}){
  const nums=vals.filter(v=>v!=null);
  if(!nums.length) return '<div class="empty">Nothing logged in this range yet.</div>';
  const W=600,H=opt.h||130,L=30,R=8,T=8,B=20,n=vals.length;
  let lo=opt.min!=null?opt.min:Math.min(...nums), hi=opt.max!=null?opt.max:Math.max(...nums);
  if(opt.bar) lo=0;
  if(hi===lo) hi=lo+1;
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const iw=W-L-R, slot=iw/n;
  const x=i=> opt.bar ? L+i*slot+slot/2 : L+(n===1?iw/2:i*iw/(n-1));
  let g='';
  [lo,hi].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${Math.round(v*10)/10}</text>`; });
  if(opt.bar){
    vals.forEach((v,i)=>{ if(v==null) return; const bw=Math.max(2,slot*0.7), yy=y(v); g+=`<rect x="${x(i)-bw/2}" y="${yy}" width="${bw}" height="${H-B-yy}" rx="2" fill="var(--bar)"/>`; });
  } else {
    let d='',pen=false;
    vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; pen=true; });
    g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    vals.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${n>45?1.8:3}" fill="var(--accent)"/>`; });
  }
  g+=`<text x="${L}" y="${H-4}">${esc(labels[0])}</text><text x="${W-R}" y="${H-4}" text-anchor="end">${esc(labels[n-1])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'chart')}">${g}</svg>`;
}

/* ---------- views ---------- */
const TABS=[['today','Journal'],['weekly','Week'],['monthly','Month'],['history','History'],['trends','Trends']];
let lastTab=null, enterTimer=0;
function render(){
  const nav=$('#tabs');
  if(!nav.children.length) nav.innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}"><span class="nic">${ic(k)}</span>${l}</button>`).join('');
  [...nav.children].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  document.body.dataset.view=S.tab;
  const v=$('#view'), fresh=S.tab!==lastTab; lastTab=S.tab;
  v.classList.remove('enter');
  v.innerHTML = ({today:vToday,weekly:vWeekly,monthly:vMonthly,history:vHistory,trends:vTrends,settings:vSettings})[S.tab]();
  if(fresh){ void v.offsetWidth; v.classList.add('enter'); clearTimeout(enterTimer); enterTimer=setTimeout(()=>v.classList.remove('enter'),900); window.scrollTo(0,0); }
  if(fresh) Object.keys(PREV).forEach(k=>delete PREV[k]);
  if(S.tab==='today'){ updateProgress(); animateArcs(); }
}

    <button class="ibtn" data-act="next" aria-label="Next day" ${isT?'disabled':''} style="${isT?'opacity:.35':''}"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg></button></div>`;

function scaleRow(field,label,lo,hi,val){
  return `<div style="margin-bottom:14px"><label>${label}</label><div class="scale">${[1,2,3,4,5].map(n=>`<button data-act="scale" data-f="${field}" data-v="${n}" aria-pressed="${val===n}" aria-label="${label} ${n} of 5">${n}</button>`).join('')}</div><div class="ends"><span>${lo}</span><span>${hi}</span></div></div>`;
}

function reviewBanner(){
  const t=todayStr(), dow=parse(t).getDay(), dom=+t.slice(8), ym=t.slice(0,7);
  let msg='',act='',k='';
  if(dow===0){ msg='It’s Sunday. Ready to look back on your week?'; act='gowk'; k=weekStart(t); }
  else if(dow===1){ const w=addDays(weekStart(t),-7); if(datesOf(w,7).some(x=>hasContent(S.days[x]))){ msg='A new week. Take a few minutes to review last week.'; act='gowk'; k=w; } }
  if(!act){
    if(dom>=27){ msg='The month is almost over. Ready to review '+fmtMonth(ym)+'?'; act='gomo'; k=ym; }
    else if(dom<=2){ const pm=addMonths(ym,-1); if(monthDates(pm).some(x=>hasContent(S.days[x]))){ msg='A new month. Take a few minutes to review '+fmtMonth(pm)+'.'; act='gomo'; k=pm; } }
  }
  return act?`<div class="banner"><span>${esc(msg)}</span><button class="btn small" data-act="${act}" data-k="${k}">Open review</button></div>`:'';
}

/* ----- history ----- */
function entryHtml(d){
  const bits=[];
  if(d.mood) bits.push(`Mood ${d.mood}/5${d.moodWord?' ('+esc(d.moodWord)+')':' · '+MOOD_LABEL[d.mood-1]}`); else if(d.moodWord) bits.push(esc(d.moodWord));
  if(d.energy) bits.push(`Energy ${d.energy}/5`);
  if(d.sleep!=null&&d.sleep!=='') bits.push(`Slept ${esc(d.sleep)}h${d.rested?` (rested ${d.rested}/5)`:''}`); else if(d.rested) bits.push(`Rested ${d.rested}/5`);
  if(d.stress) bits.push(`Stress ${d.stress}/5`);
  return `<div class="entry"><div class="row sb"><span class="d">${esc(fmtLong(d.date))}</span><button class="btn ghost small" data-act="open" data-d="${d.date}">Open</button></div>
    <div class="meta">${bits.join(' · ')||'No ratings'}</div>
    ${d.stressCause?`<p><span class="k">Most stress</span><br>${esc(d.stressCause)}</p>`:''}
    ${d.win?`<p><span class="k">Win</span><br>${esc(d.win)}</p>`:''}
    ${d.journal?`<p class="k">Reflection</p><p class="refl">${esc(d.journal)}</p>`:''}
    ${d.priority?`<p><span class="k">Next-day priority${d.priorityDone?' · done ✓':''}</span><br>${esc(d.priority)}</p>`:''}</div>`;
}
function vHistory(){
  const q=S.search.trim().toLowerCase();
  let list=Object.values(S.days).filter(hasContent).sort((a,b)=>b.date.localeCompare(a.date));
  if(q) list=list.filter(d=>JSON.stringify(d).toLowerCase().includes(q));
  return `<div class="card"><label for="q">Search your entries</label><input id="q" data-search value="${esc(S.search)}" placeholder="a word or phrase"></div>
  <div class="card"><h2>${q?'Matches':'Past entries'} (${list.length})</h2>${list.length?list.map(entryHtml).join(''):'<div class="empty">'+(q?'Nothing matches that.':'No entries yet. Your first one will show up here.')+'</div>'}</div>`;
}

/* ----- trends ----- */
function vTrends(){
  const t=todayStr(), ds=[]; for(let i=S.range-1;i>=0;i--) ds.push(addDays(t,-i));
  const labels=ds.map(fmtShort), g=f=>ds.map(k=>{ const v=S.days[k]&&S.days[k][f]; return v!=null&&v!==''?+v:null; });
  const mood=g('mood'), energy=g('energy'), stress=g('stress'), sleep=g('sleep'), rested=g('rested');
  const nn=a=>a.filter(v=>v!=null);
  const logged=ds.filter(k=>hasContent(S.days[k])).length;
  const words={}; ds.forEach(k=>{ const w=(S.days[k]&&S.days[k].moodWord||'').trim().toLowerCase(); if(w) words[w]=(words[w]||0)+1; });
  const top=Object.entries(words).sort((a,b)=>b[1]-a[1]).slice(0,6), maxW=top.length?top[0][1]:1;
  const wins=ds.filter(k=>S.days[k]&&S.days[k].win).length;
  const pr=ds.filter(k=>S.days[k]&&S.days[k].priority), prDone=pr.filter(k=>S.days[k].priorityDone).length;
  const causes=ds.slice().reverse().filter(k=>S.days[k]&&S.days[k].stressCause).slice(0,5);
  return `<div class="card"><div class="row sb"><h2 style="margin:0">Trends</h2>
    <div class="row">${[14,30,90].map(n=>`<button class="chip" data-act="range" data-n="${n}" aria-pressed="${S.range===n}">${n} days</button>`).join('')}</div></div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><b>${logged}/${S.range}</b><span>days journaled</span></div>
      <div class="stat"><b>${r1(avg(nn(mood)))}</b><span>avg mood</span></div>
      <div class="stat"><b>${r1(avg(nn(energy)))}</b><span>avg energy</span></div>
      <div class="stat"><b>${r1(avg(nn(stress)))}</b><span>avg stress</span></div>
      <div class="stat"><b>${r1(avg(nn(sleep)))}</b><span>avg sleep (h)</span></div>
      <div class="stat"><b>${pr.length?prDone+'/'+pr.length:'–'}</b><span>priorities done</span></div>
    </div></div>
  <div class="card"><h3>Mood (1–5)</h3>${chart(mood,labels,{min:1,max:5,label:'Mood over time'})}</div>
  <div class="card"><h3>Energy (1–5)</h3>${chart(energy,labels,{min:1,max:5,label:'Energy over time'})}</div>
  <div class="card"><h3>Stress (1–5)</h3>${chart(stress,labels,{min:1,max:5,label:'Stress over time'})}</div>
  <div class="card"><h3>Sleep (hours)</h3>${chart(sleep,labels,{bar:true,min:0,max:12,label:'Sleep per night'})}</div>
  <div class="card"><h3>How rested you felt (1–5)</h3>${chart(rested,labels,{min:1,max:5,label:'Rested over time'})}</div>
  <div class="card"><h3>Mood words</h3>${top.length?`<div class="bars">${top.map(([w,c])=>`<div class="b"><em>${esc(w)}</em><i style="width:${Math.max(6,c/maxW*60)}%"></i><span class="note">${c}d</span></div>`).join('')}</div>`:'<div class="empty">Pick a mood word each day to see them here.</div>'}
    <div class="note" style="margin-top:8px">${wins} daily win${wins===1?'':'s'} recorded in this range.</div></div>
  <div class="card"><h3>Recent stress causes</h3>${causes.length?causes.map(k=>`<div class="entry"><div class="meta">${esc(fmtShort(k))}${S.days[k].stress?' · stress '+S.days[k].stress+'/5':''}</div><p>${esc(S.days[k].stressCause)}</p></div>`).join(''):'<div class="empty">Nothing recorded yet.</div>'}</div>`;
}

/* ---------- weekly + monthly reviews ---------- */
const STOP = new Set('about after again also because been before being could didn feel felt from have just like more much really some than that their them then there these they this very want were what when which while with without would your'.split(' '));
const datesOf = (from,n) => { const o=[]; for(let i=0;i<n;i++) o.push(addDays(from,i)); return o; };
const monthDates = ym => { const [y,m]=ym.split('-').map(Number); return datesOf(ym+'-01',new Date(y,m,0).getDate()); };
const periodDates = (kind,key) => kind==='w' ? datesOf(key.slice(2),7) : monthDates(key.slice(2));
const prevDates = (kind,key) => kind==='w' ? datesOf(addDays(key.slice(2),-7),7) : monthDates(addMonths(key.slice(2),-1));

function statsFor(dates){
  const rows=dates.map(k=>S.days[k]).filter(hasContent);
  const num=f=>rows.map(r=>r[f]).filter(v=>v!=null&&v!=='').map(Number);
  const words={}; rows.forEach(r=>{ const w=(r.moodWord||'').trim().toLowerCase(); if(w) words[w]=(words[w]||0)+1; });
  const pr=rows.filter(r=>filled(r,'priority'));
  return {rows,n:rows.length,span:dates.length,mood:avg(num('mood')),energy:avg(num('energy')),stress:avg(num('stress')),sleep:avg(num('sleep')),rested:avg(num('rested')),
    words:Object.entries(words).sort((a,b)=>b[1]-a[1]),prSet:pr.length,prDone:pr.filter(r=>r.priorityDone).length,wins:rows.filter(r=>filled(r,'win'))};
}
function extremes(rows){
  const m=rows.filter(r=>r.mood); if(m.length<3) return null;
  const best=m.slice().sort((a,b)=>b.mood-a.mood||(a.stress||3)-(b.stress||3))[0];
  const hard=m.slice().sort((a,b)=>a.mood-b.mood||(b.stress||3)-(a.stress||3))[0];
  return best===hard?null:{best,hard};
}
function stressWords(rows){
  const c={}; rows.forEach(r=>{ const set=new Set((r.stressCause||'').toLowerCase().match(/[a-z']{4,}/g)||[]); set.forEach(w=>{ if(!STOP.has(w)) c[w]=(c[w]||0)+1; }); });
  return Object.entries(c).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,6);
}
function sleepLink(rows){
  const r=rows.filter(x=>x.sleep!=null&&x.sleep!==''&&x.mood);
  const a=r.filter(x=>+x.sleep>=7), b=r.filter(x=>+x.sleep<7);
  if(r.length<21||a.length<4||b.length<4) return {need:true,n:r.length};
  return {a:avg(a.map(x=>x.mood)),b:avg(b.map(x=>x.mood)),na:a.length,nb:b.length};
}
function tiles(st,pv,prevName){
  const dl=(c,p)=>c!=null&&p!=null?` · ${(c-p>=0?'+':'')+r1(c-p)} vs ${prevName}`:'';
  return `<div class="stats">
    <div class="stat"><b>${st.n}/${st.span}</b><span>days journaled</span></div>
    <div class="stat"><b>${r1(st.mood)}</b><span>avg mood${dl(st.mood,pv.mood)}</span></div>
    <div class="stat"><b>${r1(st.energy)}</b><span>avg energy${dl(st.energy,pv.energy)}</span></div>
    <div class="stat"><b>${r1(st.stress)}</b><span>avg stress${dl(st.stress,pv.stress)}</span></div>
    <div class="stat"><b>${r1(st.sleep)}</b><span>avg sleep (h)${dl(st.sleep,pv.sleep)}</span></div>
    <div class="stat"><b>${r1(st.rested)}</b><span>avg rested${dl(st.rested,pv.rested)}</span></div>
    <div class="stat"><b>${st.prSet?st.prDone+'/'+st.prSet:'–'}</b><span>priorities done</span></div></div>`;
}
function dayBlurb(r,label){
  return `<div><div class="note" style="font-weight:600">${label}</div><div style="font:600 16px var(--display)">${esc(fmtLong(r.date))}</div>
    <div class="note">Mood ${r.mood}/5${r.moodWord?' ('+esc(r.moodWord)+')':''}${r.stress?' · stress '+r.stress+'/5':''}</div>
    ${r.win?`<p>Win: ${esc(r.win)}</p>`:''}${r.stressCause?`<p>Stress: ${esc(r.stressCause)}</p>`:''}</div>`;
}
function wordBars(st){
  if(!st.words.length) return '<div class="empty">Pick a mood word each day to see them here.</div>';
  const max=st.words[0][1];
  return `<div class="bars">${st.words.slice(0,6).map(([w,c])=>`<div class="b"><em>${esc(w)}</em><i style="width:${Math.max(6,c/max*60)}%"></i><span class="note">${c}d</span></div>`).join('')}</div>`;
}
function reviewCard(kind,key){
  const r=S.reviews[key]||{}, per=kind==='w'?'week':'month';
  const out=S.ai.key===key&&S.ai.text?S.ai.text:(r.ai||'');
  return `<div class="card"><h2>My own takeaway</h2>
    <label for="r-notes">What do these numbers get right? What do they miss? What do I want to remember?</label>
    <textarea id="r-notes" data-rk="${key}" data-rf="notes" style="min-height:110px">${esc(r.notes||'')}</textarea></div>
  <div class="card"><h2>Reflect with Claude</h2>
    <div class="note">Claude reads this ${per}’s ratings and entries and points out themes and patterns. It describes what you wrote. It doesn’t label you or diagnose anything. Your entries are sent to Claude only when you tap the button.${SET.apiKey?'':' Add your Anthropic API key in Settings first.'}</div>
    <div class="row" style="margin-top:12px"><button class="btn" data-act="reflect" data-kind="${kind}" data-k="${key}" ${S.ai.busy?'disabled':''}>${S.ai.busy?'Reflecting…':(r.ai?'Reflect again':'Reflect on my '+per)}</button></div>
    <div id="aiout" class="ai">${esc(out)}</div></div>`;
}
function vWeekly(){
  const ws=S.wk, dates=datesOf(ws,7), key='w-'+ws, st=statsFor(dates), pv=statsFor(prevDates('w',key));
  const cur=ws===weekStart(todayStr()), ex=extremes(st.rows);
  const mood=dates.map(k=>S.days[k]&&S.days[k].mood?+S.days[k].mood:null);
  const labels=dates.map(k=>parse(k).toLocaleDateString(undefined,{weekday:'short'}));
  const causes=st.rows.filter(r=>r.stressCause);
  return periodNav(cur?'This week':'Week of '+fmtShort(ws),fmtShort(ws)+' – '+fmtShort(addDays(ws,6)),'wprev','wnext',ws<weekStart(todayStr()))+
  (st.n?'':'<div class="card empty">No entries this week yet. Check back after a few days of journaling.</div>')+
  `<div class="card"><h2>The week in numbers</h2>${tiles(st,pv,'last week')}
    ${st.n<4?'<div class="note" style="margin-top:10px">Only '+st.n+' day'+(st.n===1?'':'s')+' logged, so treat these as a rough sketch.</div>':''}</div>
  <div class="card"><h3>Mood across the week</h3>${chart(mood,labels,{min:1,max:5,label:'Mood this week'})}
    <h3 style="margin-top:16px">Mood words</h3>${wordBars(st)}</div>
  ${ex?`<div class="card"><h3>Best and hardest day</h3><div class="hl">${dayBlurb(ex.best,'Best day')}${dayBlurb(ex.hard,'Hardest day')}</div></div>`:''}
  <div class="card"><h3>Wins this week</h3>${st.wins.length?st.wins.map(r=>`<div class="entry"><div class="meta">${esc(fmtShort(r.date))}</div><p>${esc(r.win)}</p></div>`).join(''):'<div class="empty">No wins recorded yet.</div>'}</div>
  <div class="card"><h3>What stressed me</h3>${causes.length?causes.map(r=>`<div class="entry"><div class="meta">${esc(fmtShort(r.date))}${r.stress?' · stress '+r.stress+'/5':''}</div><p>${esc(r.stressCause)}</p></div>`).join(''):'<div class="empty">Nothing recorded.</div>'}</div>`+
  reviewCard('w',key);
}
function vMonthly(){
  const ym=S.mo, dates=monthDates(ym), key='m-'+ym, st=statsFor(dates), pv=statsFor(prevDates('m',key)), r=S.reviews[key]||{};
  const mood=dates.map(k=>S.days[k]&&S.days[k].mood?+S.days[k].mood:null), labels=dates.map(k=>String(+k.slice(8)));
  const ex=extremes(st.rows), sw=stressWords(st.rows), sl=sleepLink(st.rows);
  const topStress=st.rows.filter(x=>x.stress&&x.stressCause).sort((a,b)=>b.stress-a.stress).slice(0,3);
  return periodNav(fmtMonth(ym),st.n+' day'+(st.n===1?'':'s')+' journaled','mprev','mnext',ym<todayStr().slice(0,7))+
  `<div class="card"><h2>What I want to focus on</h2>
    <label for="r-int">Intentions for this month</label>
    <textarea id="r-int" data-rk="${key}" data-rf="intentions" style="min-height:90px" placeholder="e.g. Sleep 7+ hours. Take a walk after work. Finish the application.">${esc(r.intentions||'')}</textarea></div>`+
  (st.n?'':'<div class="card empty">No entries this month yet.</div>')+
  `<div class="card"><h2>The month in numbers</h2>${tiles(st,pv,'last month')}
    ${st.n<10?'<div class="note" style="margin-top:10px">Only '+st.n+' day'+(st.n===1?'':'s')+' logged, so treat these as a rough sketch.</div>':''}</div>
  <div class="card"><h3>Mood across the month</h3>${chart(mood,labels,{min:1,max:5,label:'Mood this month'})}
    <h3 style="margin-top:16px">Mood words</h3>${wordBars(st)}</div>
  ${ex?`<div class="card"><h3>Best and hardest day</h3><div class="hl">${dayBlurb(ex.best,'Best day')}${dayBlurb(ex.hard,'Hardest day')}</div></div>`:''}
  <div class="card"><h3>What keeps stressing me</h3>
    ${sw.length?`<div class="chips">${sw.map(([w,c])=>`<span class="chip on">${esc(w)} · ${c} days</span>`).join('')}</div><div class="note" style="margin:8px 0 12px">Words that showed up in your stress notes on two or more days.</div>`:'<div class="note" style="margin-bottom:8px">Once the same word shows up in your stress notes on two or more days, it will appear here.</div>'}
    ${topStress.length?`<h3>Highest-stress days</h3>${topStress.map(x=>`<div class="entry"><div class="meta">${esc(fmtShort(x.date))} · stress ${x.stress}/5</div><p>${esc(x.stressCause)}</p></div>`).join('')}`:''}</div>
  <div class="card"><h3>Sleep and mood</h3>${sl.need
    ?`<div class="empty">Not enough data yet. This needs at least 21 days with both sleep and mood logged, and at least 4 days on each side of 7 hours. You have ${sl.n}.</div>`
    :`<div class="stats"><div class="stat"><b>${r1(sl.a)}</b><span>avg mood after 7+ h sleep (${sl.na} days)</span></div><div class="stat"><b>${r1(sl.b)}</b><span>avg mood after under 7 h (${sl.nb} days)</span></div></div><div class="note" style="margin-top:10px">This shows how your mood and sleep line up, not that one causes the other.</div>`}</div>
  <div class="card"><h3>Wins</h3><div class="stat"><b>${st.wins.length}</b><span>days with a win recorded this month</span></div></div>`+
  reviewCard('m',key);
}

/* ---------- Claude (your own API key, stored only on this phone) ---------- */
async function claudeText(prompt,max){
  if(!SET.apiKey) throw {message:'Add your Anthropic API key in Settings to use Claude reflections.'};
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':SET.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:SET.model||'claude-sonnet-5-5',max_tokens:max||1500,messages:[{role:'user',content:[{type:'text',text:prompt}]}]})});
  }catch(e){ throw {message:'Could not reach Claude. Check your internet connection.'}; }
  if(!r.ok){
    let m=''; try{ m=(await r.json()).error.message; }catch(e){}
    throw {code:r.status,message:r.status===401?'Your API key was rejected. Check it in Settings.':r.status===429?'Too many requests right now. Wait a minute and try again.':'Claude request failed ('+r.status+'). '+m};
  }
  const j=await r.json();
  return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
}
function digest(kind,key){
  const dates=periodDates(kind,key), st=statsFor(dates), pv=statsFor(prevDates(kind,key)), rv=S.reviews[key]||{};
  const avgs=s=>`mood ${r1(s.mood)}/5, energy ${r1(s.energy)}/5, stress ${r1(s.stress)}/5 (5 = overwhelmed), sleep ${r1(s.sleep)}h, rested ${r1(s.rested)}/5, ${s.n} days journaled`;
  const L=[];
  L.push(kind==='w'?`WEEK: ${fmtLong(dates[0])} to ${fmtLong(dates[6])}`:`MONTH: ${fmtMonth(key.slice(2))}`);
  if(kind==='m') L.push(`Intentions I set: ${rv.intentions||'(none written)'}`);
  L.push('This period averages: '+avgs(st));
  L.push((kind==='w'?'Last week':'Last month')+' averages: '+(pv.n?avgs(pv):'(no data)'));
  if(st.words.length) L.push('Mood words by number of days: '+st.words.map(([w,c])=>w+' '+c).join(', '));
  L.push(`Priorities set: ${st.prSet}, marked done: ${st.prDone}`);
  L.push('DAILY ENTRIES:');
  st.rows.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    L.push(`${r.date} | mood ${r.mood??'-'}${r.moodWord?' ('+r.moodWord+')':''} energy ${r.energy??'-'} stress ${r.stress??'-'} sleep ${r.sleep??'-'}h rested ${r.rested??'-'} | stress cause: ${r.stressCause||'-'} | win: ${r.win||'-'} | priority for next day: ${r.priority||'-'}${r.priorityDone?' (done)':''} | reflection: ${(r.journal||'').slice(0,600).replace(/\n+/g,' ')||'-'}`);
  });
  if(rv.notes) L.push(`My own takeaway so far: ${rv.notes}`);
  return L.join('\n');
}
async function reflect(kind,key){
  const st=statsFor(periodDates(kind,key)), out=$('#aiout');
  if(!st.n){ if(out) out.textContent='There are no entries in this period yet.'; return; }
  if(!SET.apiKey){ if(out) out.textContent='Add your Anthropic API key in Settings (top right) to use Claude reflections.'; return; }
  S.ai={busy:true,key,text:''};
  const btn=$('[data-act="reflect"]'); if(btn){ btn.disabled=true; btn.textContent='Reflecting…'; }
  if(out) out.innerHTML='<span class="spin"></span>Claude is reading your entries…';
  const per=kind==='w'?'week':'month';
  const prompt=`You are a warm, thoughtful companion helping someone reflect on a ${per} of their personal journal (mood, energy, sleep, stress, daily wins, daily reflections and priorities). Write in second person, kind and honest, never clinical.\n\nRules: Describe patterns in what they actually wrote and rated. Do NOT assign a personality type, a label, or a diagnosis, and do not speculate about their character. Say plainly when the data is too thin to tell, and never present a correlation as a cause. If the entries show a sustained run of very low mood, high stress or poor sleep, or mention hopelessness or self-harm, say so gently and encourage reaching out to someone they trust or a professional (in the US they can call or text 988).\n\nUse exactly these sections with short plain headings:\n1. The shape of the ${per} (2-3 sentences)\n2. What was on your mind (themes, quoting a few of my words where it helps)\n3. Patterns worth noticing\n4. Things to celebrate\n5. ${kind==='m'?'Progress on your intentions (compare against the intentions I set; if none, skip this and say so in one line)':'How your priorities went'}\n6. Two questions to reflect on\n7. One small thing to try next ${per}\n\nKeep it under 350 words. Plain text, no markdown symbols.\n\nHere is my data:\n${digest(kind,key)}`;
  try{
    const text=(await claudeText(prompt,1500)).trim();
    S.ai.text=text; editReview(key,x=>{ x.ai=text; x.aiAt=Date.now(); });
    const o=$('#aiout'); if(o) o.textContent=text;
  }catch(e){
    const o=$('#aiout'); if(o) o.textContent=(e&&e.message)||'Could not generate the reflection right now. Please try again.';
  }
  S.ai.busy=false; const b=$('[data-act="reflect"]'); if(b){ b.disabled=false; b.textContent='Reflect again'; }
}

/* ---------- voice typing (browser speech recognition) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null;
function setPartial(t){ S.partial=t; const p=$('#partial'); if(p) p.textContent=t; }
function setNote(t){ S.dictNote=t; const n=$('#dictnote'); if(n) n.textContent=t||'Tip: the microphone key on your phone’s keyboard also types what you say.'; }
function updateMic(){ const b=$('#micbtn'); if(b){ b.innerHTML=micLabel(); b.classList.toggle('rec',S.listening); } }
function appendDictation(text){
  const t=(text||'').trim(); if(!t) return;
  const date=S.dictDate||S.date;
  editDay(date,d=>{ const cur=d.journal||''; d.journal=cur+(cur&&!/\s$/.test(cur)?' ':'')+t; });
  const ta=$('#f-journal'); if(ta && date===S.date){ ta.value=S.days[date].journal; ta.scrollTop=ta.scrollHeight; updateProgress(); }
}
function toggleMic(){
  if(!SR) return;
  if(S.listening){ try{ rec.stop(); }catch(e){} return; }
  S.dictDate=S.date; setNote('');
  rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang=navigator.language||'en-US';
  rec.onstart=()=>{ S.listening=true; updateMic(); };
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) appendDictation(r[0].transcript); else interim+=r[0].transcript; }
    setPartial(interim);
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed') setNote('Microphone access is blocked for this app. Allow it in your browser’s site settings, or use the microphone key on your keyboard.');
    else if(e.error==='network') setNote('Voice typing needs an internet connection.');
    else if(e.error!=='no-speech'&&e.error!=='aborted') setNote('Voice typing stopped ('+e.error+'). You can keep typing.');
  };
  rec.onend=()=>{ S.listening=false; setPartial(''); updateMic(); };
  try{ rec.start(); }catch(e){ setNote('Could not start the microphone. You can keep typing.'); }
}

/* ---------- backup / restore ---------- */
function exportData(){
  const json=JSON.stringify({app:'daily-journal',version:1,exported:new Date().toISOString(),days:S.days,reviews:S.reviews},null,2);
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download='daily-journal-backup-'+todayStr()+'.json'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
    setSync('Backup downloaded');
  }catch(e){ setSync('Could not create backup'); }
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||typeof o.days!=='object'||Array.isArray(o.days)) throw new Error('bad file');
      S.days=Object.assign({},S.days,o.days); S.reviews=Object.assign({},S.reviews,o.reviews||{});
      saveNow(); render(); setSync('Backup restored');
    }catch(e){ setSync('That file is not a Daily Journal backup'); }
  };
  r.readAsText(file);
}

/* ---------- settings view ---------- */
function healthKey(){ try{ return (JSON.parse(localStorage.getItem('hj-settings')||'{}').apiKey)||''; }catch(e){ return ''; } }
function vSettings(){
  const hk=healthKey();
  return `<div class="card"><h2>Install on your phone</h2>
    ${S.installEvt?'<button class="btn" data-act="install">Install app</button>':''}
    <div class="note" style="margin-top:8px">Samsung Internet: tap the menu (≡), then <b>Add page to</b> → <b>Home screen</b>. Chrome: tap ⋮ then <b>Install app</b> or <b>Add to Home screen</b>. Once installed it opens full screen and works offline.</div></div>
  <div class="card"><h2>Claude reflections</h2>
    <label for="s-key">Anthropic API key</label>
    <input id="s-key" data-set="apiKey" type="password" autocomplete="off" value="${esc(SET.apiKey)}" placeholder="sk-ant-…">
    ${hk&&!SET.apiKey?'<div class="row" style="margin-top:10px"><button class="btn ghost small" data-act="usehkey">Use the key from my Health Tracker</button></div>':''}
    <label for="s-model" style="margin-top:12px">Model</label>
    <select id="s-model" data-set="model">${[['claude-sonnet-5-5','Sonnet 5.5 (best balance)'],['claude-haiku-5-5','Haiku 5.5 (cheapest)'],['claude-opus-5-5','Opus 5.5 (most capable)']].map(([v,l])=>`<option value="${v}" ${SET.model===v?'selected':''}>${l}</option>`).join('')}</select>
    <div class="note" style="margin-top:10px">Only needed for the “Reflect with Claude” buttons in the Week and Month tabs. The key is stored only on this phone and is sent only to Anthropic, and only when you tap Reflect. A reflection typically costs a few cents.</div></div>
  <div class="card"><h2>Voice typing</h2>
    <div class="note">${SR?'The Talk button on the Journal tab uses your browser’s speech recognition. It needs an internet connection and microphone permission.':'This browser has no built-in speech recognition, so there is no Talk button.'} The microphone key on your phone’s keyboard works in any text box either way.</div></div>
  <div class="card"><h2>Your data</h2>
    <div class="note">Your entries live only on this phone. The app’s code is public on GitHub, but your journal never is. If you clear browser data or uninstall, the entries are gone, so download a backup now and then. You can also restore a backup made in the claude.ai version of this journal.</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost small" data-act="export">Download backup (.json)</button>
      <span class="btn ghost small filebtn">Restore from backup<input type="file" accept="application/json,.json" data-import="1"></span></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){ if(S.listening&&rec){ try{rec.stop()}catch(x){} } S.tab=t.dataset.tab; render(); return; }
  const a=t.dataset.act;
  if(a==='mic'){ toggleMic(); return; }
  if(S.listening && rec && (a==='prev'||a==='next'||a==='today'||a==='open')){ try{ rec.stop(); }catch(x){} }
  switch(a){
    case 'prev': S.date=addDays(S.date,-1); render(); break;
    case 'next': if(S.date<todayStr()){ S.date=addDays(S.date,1); render(); } break;
    case 'today': S.date=todayStr(); render(); break;
    case 'open': S.date=t.dataset.d; S.tab='today'; render(); break;
    case 'scale': { const f=t.dataset.f, v=+t.dataset.v; editDay(S.date,d=>{ d[f]=d[f]===v?null:v; }); const cur=day(S.date)[f];
      t.parentElement.querySelectorAll('button').forEach(b=>{ b.setAttribute('aria-pressed',String(cur===+b.dataset.v)); b.classList.remove('pop'); });
      if(cur===v){ void t.offsetWidth; t.classList.add('pop'); }
      refreshHero(); break; }
    case 'word': { const w=t.dataset.w; editDay(S.date,d=>{ d.moodWord=(d.moodWord||'').toLowerCase()===w.toLowerCase()?'':w; }); const cur=(day(S.date).moodWord||'').toLowerCase();
      document.querySelectorAll('#moodchips .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.w.toLowerCase()===cur)));
      const mi=$('#f-moodword'); if(mi) mi.value=day(S.date).moodWord||''; refreshHero(); break; }
    case 'range': S.range=+t.dataset.n; render(); break;
    case 'wprev': S.wk=addDays(S.wk,-7); render(); break;
    case 'wnext': if(S.wk<weekStart(todayStr())){ S.wk=addDays(S.wk,7); render(); } break;
    case 'mprev': S.mo=addMonths(S.mo,-1); render(); break;
    case 'mnext': if(S.mo<todayStr().slice(0,7)){ S.mo=addMonths(S.mo,1); render(); } break;
    case 'gowk': S.wk=t.dataset.k; S.tab='weekly'; render(); break;
    case 'gomo': S.mo=t.dataset.k; S.tab='monthly'; render(); break;
    case 'reflect': reflect(t.dataset.kind,t.dataset.k); break;
    case 'export': exportData(); break;
    case 'usehkey': SET.apiKey=healthKey(); saveSet(); render(); break;
    case 'install': if(S.installEvt){ S.installEvt.prompt(); S.installEvt=null; render(); } break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='prevdone'){ editDay(t.dataset.d,d=>{ d.priorityDone=t.checked; }); return; }
  if(t.dataset.import){ const f=t.files&&t.files[0]; t.value=''; if(f) importData(f); return; }
  if(t.dataset.set){ SET[t.dataset.set]=t.value.trim(); saveSet(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.set){ SET[t.dataset.set]=t.value.trim(); saveSet(); return; }
  if(t.dataset.search!=null){
    S.search=t.value; const pos=t.selectionStart; render(); const q=$('#q'); if(q){ q.focus(); q.setSelectionRange(pos,pos); } return;
  }
  if(t.dataset.rf){ const v=t.value; editReview(t.dataset.rk,r=>{ r[t.dataset.rf]=v; }); return; }
  const f=t.dataset.f; if(!f) return;
  let v=t.value; if(f==='sleep') v = v===''?null:+v;
  editDay(S.date,d=>{ d[f]=v; });
  updateProgress();
  if(f==='moodWord'){ refreshHero(); const w=v.trim().toLowerCase(); document.querySelectorAll('#moodchips .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.w.toLowerCase()===w))); }
});

/* ---------- start ---------- */
loadLocal();
{ const h=new Date().getHours(), g=$('#greet'); if(g) g.textContent=h<4?'Still up?':h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }
render();
setSync(Object.keys(S.days).length?'Saved on this device':'Your entries stay on this device');
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.installEvt=e; if(S.tab==='settings') render(); });
window.addEventListener('appinstalled',()=>{ S.installEvt=null; if(S.tab==='settings') render(); });
